<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<canvas id="myChart" width="400" height="200"></canvas>

<script>

  new Chart(ctx, {
    type: 'bar',

        data: [20,27,6],
      }]
    }
  })
</script>
